    <!-- ═══════════════════════════════════════════

         ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é que a Reminder faz exactamente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Reminder constrói e opera sistemas de IA que contactam, acompanham e qualificam os seus leads e prospects — desde o primeiro contacto até à reunião qualificada. Trabalhamos outbound, inbound e reactivação de contactos."
          }
        },
        {
          "@type": "Question",
          "name": "A IA substitui os meus vendedores?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. A IA trata da execução repetitiva: contacto, follow-up, qualificação inicial e agendamento. Os comerciais continuam responsáveis pelas conversas de venda, propostas, negociação e fecho."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso de mudar o meu CRM ou ferramentas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não necessariamente. Trabalhamos com o stack existente sempre que tecnicamente possível — HubSpot, Salesforce, Pipedrive, entre outros."
          }
        },
        {
          "@type": "Question",
          "name": "Garantem reuniões ou receita?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não prometemos resultados que dependem de factores que não controlamos. Antes de começar, definimos baseline, KPIs e critérios de sucesso. Depois medimos e otimizamos com base nos dados reais."
          }
        },
        {
          "@type": "Question",
          "name": "Tenho de configurar tudo sozinho?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. A Reminder trata de tudo — diagnóstico, construção, implementação e operação. É um serviço done-for-you, não uma ferramenta para a sua equipa aprender."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o roadmap de conversão gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Responde a 7 perguntas sobre o seu processo comercial (menos de 60 segundos). Analisamos onde se perdem oportunidades e enviamos um roadmap personalizado com o principal gargalo e recomendações concretas."
          }
        },
        {
          "@type": "Question",
          "name": "Para que tipo de empresas é a Reminder?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Reminder é para empresas B2B de serviços e consultoria em Portugal que já têm uma equipa comercial activa, já geram leads, e onde as reuniões são importantes para fechar negócios. O ticket médio por cliente deve ser superior a €5.000."
          }
        }
      ]
    }
    </script>
